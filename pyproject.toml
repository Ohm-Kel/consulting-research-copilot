[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consulting-research-copilot"
description = "Question answering over company annual reports with page-level citations, hybrid retrieval, a tool-calling agent and evidence-level evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Semanu Kwaku Sebuava" }]
keywords = ["rag", "retrieval", "llm", "agents", "evaluation", "fastapi"]
dynamic = ["version"]
# Exact pins; uv.lock pins every transitive dependency too. Update with `uv lock --upgrade-package <name>`.
dependencies = [
    # LLM client (pinned to the version the ragas install resolves to)
    "openai==1.109.1",
    # Embeddings, reranking and PDF parsing
    "sentence-transformers==6.1.0",
    "torch==2.14.0",  # CPU-only build on Linux, see [tool.uv.sources]
    "pypdf==6.21.2",
    "fonttools==4.66.0",  # lets pypdf decode the embedded fonts in some annual reports
    "numpy==2.5.3",
    "python-dotenv==1.2.3",
    # Retrieval. chromadb is used in-process only (PersistentClient); its HTTP server is never
    # started. The open advisories for 1.5.9 (CVE-2026-45829/45830/45831/45833) all need that
    # server, and no patched release exists yet. Upgrade when one does.
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    # API
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.urls]
Repository = "https://github.com/Ohm-Kel/consulting-research-copilot"

[project.scripts]
copilot = "copilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["copilot"]

[tool.setuptools.package-data]
copilot = ["static/*.html"]  # the demo page served at /

[tool.setuptools.dynamic]
version = { attr = "copilot.__version__" }

[dependency-groups]
# Installed by `uv sync`; left out of the Docker image with `--no-dev`.
dev = [
    # Testing and code quality
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    # LLM-judged evaluation. Open advisories in ragas and the packages it pulls in, none of which
    # apply here: CVE-2026-6587 (ragas's multi-modal faithfulness metric, unused), CVE-2025-69872
    # (diskcache, used only when ragas caching is turned on, which it never is) and CVE-2026-41488
    # (langchain-openai's token counting for image inputs, which are never sent; its fix needs
    # openai 2.x). No patched ragas or diskcache release exists yet.
    "ragas==0.4.3",
    "langchain-community==0.3.31",  # ragas 0.4.3 imports a module that langchain-community removed in 0.4
]

[tool.uv]
# Lock for the platforms the project runs on: Windows and macOS laptops, Linux for CI and Docker.
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'", "sys_platform == 'linux'"]

# The default Linux torch wheel pulls several GB of CUDA libraries; the app runs on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["copilot"]

[tool.coverage.report]
show_missing = true
fail_under = 93  # coverage was 94% when this gate was added; one point of slack

[tool.mypy]
python_version = "3.12"
files = ["src", "evals", "scripts"]
ignore_missing_imports = true  # several ML libraries ship without type stubs

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "chroma_db"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
    "D1",  # missing docstrings
]
ignore = [
    "D105", # magic methods
    "D107", # __init__ (documented on the class)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
