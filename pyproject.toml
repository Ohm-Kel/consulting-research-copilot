[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consulting-research-copilot"
description = "Question answering over company annual reports with page-level citations, hybrid retrieval, a tool-calling agent and evidence-level evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Semanu Kwaku Sebuava" }]
keywords = ["rag", "retrieval", "llm", "agents", "evaluation", "fastapi"]
dynamic = ["version", "dependencies"]

[project.urls]
Repository = "https://github.com/Ohm-Kel/consulting-research-copilot"

[project.scripts]
copilot = "copilot.cli:main"

[tool.setuptools]
packages = ["copilot"]

[tool.setuptools.dynamic]
version = { attr = "copilot.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
files = ["copilot", "evals", "scripts"]
ignore_missing_imports = true  # several ML libraries ship without type stubs

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "chroma_db"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
    "D1",  # missing docstrings
]
ignore = [
    "D105", # magic methods
    "D107", # __init__ (documented on the class)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
