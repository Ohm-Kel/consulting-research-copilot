name: Deploy

# Builds the same Dockerfile that CI tests, pushes it to Artifact Registry and deploys it to
# Cloud Run. Runs for release tags, or by hand from the Actions tab. It is skipped until the
# repository variables from docs/deployment.md (one-time setup: scripts/gcp_setup.sh) are set.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job swap GitHub's OIDC token for short-lived Google credentials

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: consulting-research-copilot
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  cloud-run:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/copilot/${SERVICE}:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 2 GiB is about twice the API's measured peak memory. One instance at most keeps the
      # in-memory rate limits and the daily /query limit exact; it scales to zero when idle.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "copilot-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port 8000 --cpu 2 --memory 2Gi --cpu-boost \
            --min-instances 0 --max-instances 1 --concurrency 4 --timeout 300 \
            --set-secrets "OPENAI_API_KEY=openai-api-key:latest" \
            --set-env-vars "COPILOT_QUERY_DAILY_LIMIT=${{ vars.COPILOT_QUERY_DAILY_LIMIT || '50' }},FORWARDED_ALLOW_IPS=*,COPILOT_PRICE_INPUT_PER_MTOK=0.20,COPILOT_PRICE_OUTPUT_PER_MTOK=1.20" \
            --allow-unauthenticated \
            --quiet
          echo "URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_ENV"

      - name: Smoke test the live service
        run: |
          curl -sf --max-time 60 "$URL/health"
          curl -sf --max-time 120 -X POST "$URL/search" -H 'content-type: application/json' \
            -d '{"question": "How fast did HOKA grow?", "k": 1}' > /dev/null
          echo "Deployed ${GITHUB_REF_NAME} to $URL" >> "$GITHUB_STEP_SUMMARY"
