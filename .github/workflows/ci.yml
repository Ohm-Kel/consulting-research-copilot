name: CI

on:
  push:
    branches: ["**"]  # branch pushes only; pushing a release tag does not re-run CI
  pull_request:
  workflow_dispatch:
    inputs:
      ragas:
        description: "Also run the RAGAS answer-quality eval (uses the OpenAI API)"
        type: boolean
        default: false

# Read-only token: the workflow only checks out code and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Python 3.12 comes from .python-version; the activated .venv puts `python` on PATH for later steps.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
          activate-environment: true

      - name: Install the locked dependencies (CPU-only torch on Linux)
        run: uv sync --locked

      - name: Lint, format and type check
        run: make lint

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/copilot/config.py') }}

      - name: Cache reports
        uses: actions/cache@v6
        with:
          path: data
          key: reports-${{ hashFiles('scripts/download_data.py') }}

      - name: Download reports
        run: python scripts/download_data.py

      - name: Unit tests with coverage gate (LLM is mocked)
        # The floor (fail_under) and the measured package are set in pyproject.toml.
        run: |
          python -m pytest -q --cov
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Build index
        run: python -m copilot.cli ingest

      - name: Retrieval regression gate (no API key needed)
        # Current Hit@5 is 0.88 (evidence-level); fail if it drops by more than one question (0.04).
        run: python evals/run_retrieval_eval.py --modes hybrid_rerank --min-hit 0.84

      - name: Held-out retrieval report (reported, not gated, so it is never tuned on)
        run: python evals/run_retrieval_eval.py --set heldout --modes vector hybrid_rerank

      - name: Hard held-out retrieval report (reported, not gated)
        run: python evals/run_retrieval_eval.py --set hard --modes vector hybrid_rerank

      - name: Comparison retrieval report (reported, not gated)
        run: python evals/run_comparison_eval.py --modes vector hybrid_rerank

      - name: Guardrail regression gate (no API key needed)
        run: python evals/run_guardrail_eval.py --strict

      - name: Agent eval with gpt-5.6-luna (runs when OPENAI_API_KEY secret is set)
        if: env.OPENAI_API_KEY != ''
        run: python evals/run_agent_eval.py

      - name: RAGAS eval (manual runs only, when requested)
        if: env.OPENAI_API_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.ragas
        run: python evals/run_ragas_eval.py --modes vector hybrid_rerank

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/

  # Runs on every branch and PR, in parallel with the tests, so a broken image is caught before merge.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t consulting-research-copilot .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name copilot consulting-research-copilot
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 5; done
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"question": "How fast did HOKA grow?", "k": 2}'
