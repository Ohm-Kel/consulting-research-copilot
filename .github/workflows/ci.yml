name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ragas:
        description: "Also run the RAGAS answer-quality eval (uses the Anthropic API)"
        type: boolean
        default: false

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('copilot/config.py') }}

      - name: Cache reports
        uses: actions/cache@v4
        with:
          path: data
          key: reports-${{ hashFiles('scripts/download_data.py') }}

      - name: Download reports
        run: python scripts/download_data.py

      - name: Unit tests (Claude is mocked)
        run: python -m pytest -q

      - name: Build index
        run: python -m copilot.cli ingest

      - name: Retrieval regression gate (no API key needed)
        # Current Hit@5 is 0.76; fail the build if retrieval quality drops below 0.72.
        run: python evals/run_retrieval_eval.py --modes vector hybrid_rerank && python evals/run_retrieval_eval.py --modes hybrid_rerank --min-hit 0.72

      - name: Guardrail regression gate (no API key needed)
        run: python evals/run_guardrail_eval.py --strict

      - name: Agent eval with Claude Haiku 4.5 (runs when ANTHROPIC_API_KEY secret is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: python evals/run_agent_eval.py

      - name: RAGAS eval (manual runs only, when requested)
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.ragas
        run: python evals/run_ragas_eval.py --modes vector hybrid_rerank

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/

  docker:
    runs-on: ubuntu-latest
    needs: test-and-eval
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t consulting-copilot .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name copilot consulting-copilot
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 5; done
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"question": "How fast did HOKA grow?", "k": 2}'
